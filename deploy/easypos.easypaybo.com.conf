# nginx vhost para easypos.easypaybo.com → app easy pos (Next.js) en el 3090.
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled/.
# El bloque HTTPS (443) lo agrega `certbot --nginx` solo; acá va el HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name easypos.easypaybo.com;

    # easypos.easypaybo.com  → directo al panel del equipo easy pos.
    # Match exacto de la raíz: no afecta a /panel, /n/<slug>, /api, /parear…
    location = / {
        return 302 /panel;
    }

    # Descargas (APK de la app móvil y afines): directo del disco, sin pasar
    # por Next — Next no sirve archivos agregados a public/ después del build.
    location /descargas/ {
        alias /home/petrobox/easypos/public/descargas/;
    }

    # El panel del equipo (/panel), el CRM de cada negocio (/n/<slug>) y la API,
    # todo lo sirve la misma app Next en el 3090.
    location / {
        proxy_pass         http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;           # SSE / esperas largas del pareo
        client_max_body_size 12m;          # subida de fotos y logo
    }
}
